<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio di Funzione Interattivo</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- KaTeX per il rendering preciso delle formule matematiche -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
        canvas {
            touch-action: none;
            display: block;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans">

    <!-- Header Navigation -->
    <header class="bg-white border-b border-slate-300 shadow-sm sticky top-0 z-50 px-4 py-3">
        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-indigo-100 border border-indigo-200 rounded-xl text-indigo-700">
                    <i data-lucide="function-square" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-slate-900 leading-tight">Studio di Funzione Interattivo</h1>
                    <!-- Menu a tendina per selezione esercizio -->
                    <div class="flex items-center gap-2 mt-0.5">
                        <label for="function-select" class="text-xs font-semibold text-slate-500">Seleziona Funzione:</label>
                        <select id="function-select" onchange="changeFunction(this.value)" class="text-xs font-bold text-indigo-700 bg-indigo-50/80 border border-indigo-200 rounded-lg px-2.5 py-1 focus:outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer hover:bg-indigo-100 transition shadow-sm">
                            <option value="ex1">Es. 1: y = (x + 5) / (x - 5)</option>
                            <option value="ex2">Es. 2: y = 3x - 6</option>
                            <option value="ex3">Es. 3: y = √(2x - 1)</option>
                            <option value="ex4">Es. 4: y = (2x + 4) / (3x - 6)</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <!-- Step Selector Tabs -->
            <div class="flex items-center bg-slate-200/80 p-1 rounded-xl border border-slate-300 text-xs sm:text-sm font-medium overflow-x-auto max-w-full">
                <button onclick="setStep(0)" id="tab-0" class="px-3 py-1.5 rounded-lg transition-all flex items-center gap-1.5 whitespace-nowrap">
                    <span class="w-5 h-5 rounded-full bg-slate-300 text-slate-700 text-xs flex items-center justify-center font-bold">1</span>
                    <span>Dominio</span>
                </button>
                <button onclick="setStep(1)" id="tab-1" class="px-3 py-1.5 rounded-lg transition-all flex items-center gap-1.5 whitespace-nowrap">
                    <span class="w-5 h-5 rounded-full bg-slate-300 text-slate-700 text-xs flex items-center justify-center font-bold">2</span>
                    <span>Intersezioni</span>
                </button>
                <button onclick="setStep(2)" id="tab-2" class="px-3 py-1.5 rounded-lg transition-all flex items-center gap-1.5 whitespace-nowrap">
                    <span class="w-5 h-5 rounded-full bg-slate-300 text-slate-700 text-xs flex items-center justify-center font-bold">3</span>
                    <span>Segno</span>
                </button>
                <button onclick="setStep(3)" id="tab-3" class="px-3 py-1.5 rounded-lg transition-all flex items-center gap-1.5 whitespace-nowrap">
                    <span class="w-5 h-5 rounded-full bg-slate-300 text-slate-700 text-xs flex items-center justify-center font-bold">4</span>
                    <span>Grafico Finale</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="max-w-7xl w-full mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 flex-1">

        <!-- Left Column: Step Explanations & Theory (5 cols) -->
        <div class="lg:col-span-5 flex flex-col gap-5">

            <!-- Card Spiegazione Passaggio -->
            <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm flex-1 flex flex-col justify-between">
                <div>
                    <!-- Step Header -->
                    <div class="flex items-center justify-between pb-4 border-b border-slate-200 mb-4">
                        <span id="step-tag" class="px-2.5 py-1 rounded-md text-xs font-semibold bg-indigo-50 text-indigo-700 border border-indigo-200">
                            PASSO 1 DI 4
                        </span>
                        <div class="flex gap-1 text-slate-500">
                            <button onclick="prevStep()" id="btn-prev" class="p-1.5 hover:bg-slate-100 rounded-lg transition disabled:opacity-30 disabled:cursor-not-allowed" title="Precedente">
                                <i data-lucide="arrow-left" class="w-5 h-5"></i>
                            </button>
                            <button onclick="nextStep()" id="btn-next" class="p-1.5 hover:bg-slate-100 rounded-lg transition disabled:opacity-30 disabled:cursor-not-allowed" title="Successivo">
                                <i data-lucide="arrow-right" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Step Content Area -->
                    <div id="step-content" class="space-y-4 text-slate-700 text-sm leading-relaxed">
                        <!-- Iniettato dinamicamente da JS -->
                    </div>
                </div>

                <!-- Step Footer Navigation -->
                <div class="pt-4 mt-6 border-t border-slate-200 flex items-center justify-between">
                    <button onclick="prevStep()" id="btn-prev-text" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 rounded-xl text-xs font-semibold text-slate-700 transition flex items-center gap-1">
                        <i data-lucide="chevron-left" class="w-4 h-4"></i> Indietro
                    </button>
                    <button onclick="nextStep()" id="btn-next-text" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-semibold transition shadow-md shadow-indigo-600/20 flex items-center gap-1">
                        Prosegui <i data-lucide="chevron-right" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <!-- Card dei Controlli di Visualizzazione Grafica -->
            <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
                <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-3 flex items-center gap-2">
                    <i data-lucide="sliders" class="w-4 h-4 text-indigo-600"></i>
                    Elementi nel Piano Cartesiano
                </h3>
                <div class="grid grid-cols-2 gap-2 text-xs">
                    <label class="flex items-center gap-2 p-2 bg-slate-50 rounded-lg border border-slate-200 cursor-pointer hover:bg-slate-100 transition">
                        <input type="checkbox" id="toggle-asymptote" onchange="redrawCanvas()" checked class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500">
                        <span id="label-toggle-asymptote" class="text-slate-700 font-medium">Escluso dal dominio</span>
                    </label>
                    <label class="flex items-center gap-2 p-2 bg-slate-50 rounded-lg border border-slate-200 cursor-pointer hover:bg-slate-100 transition">
                        <input type="checkbox" id="toggle-points" onchange="redrawCanvas()" checked class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500">
                        <span id="label-toggle-points" class="text-slate-700 font-medium">Punti di Intersezione</span>
                    </label>
                    <label class="flex items-center gap-2 p-2 bg-slate-50 rounded-lg border border-slate-200 cursor-pointer hover:bg-slate-100 transition">
                        <input type="checkbox" id="toggle-regions" onchange="redrawCanvas()" checked class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500">
                        <span class="text-slate-700 font-medium">Regioni escluse dallo studio del segno</span>
                    </label>
                    <label class="flex items-center gap-2 p-2 bg-slate-50 rounded-lg border border-slate-200 cursor-pointer hover:bg-slate-100 transition">
                        <input type="checkbox" id="toggle-curve" onchange="redrawCanvas()" class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500">
                        <span id="label-toggle-curve" class="text-slate-700 font-medium">Curva Iperbole</span>
                    </label>
                </div>
            </div>

        </div>

        <!-- Right Column: Interactive Cartesian Canvas (7 cols) -->
        <div class="lg:col-span-7 flex flex-col">
            <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm flex-1 flex flex-col relative overflow-hidden">
                
                <!-- Canvas Top Bar Controls -->
                <div class="flex items-center justify-between mb-3 px-1">
                    <div class="flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                        <span class="text-xs font-semibold text-slate-700">Piano Cartesiano (Sfondo Chiaro)</span>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <button onclick="resetZoom()" class="p-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-medium border border-slate-200 transition flex items-center gap-1" title="Ripristina Vista">
                            <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i> Centra
                        </button>
                        <button onclick="zoom(1.2)" class="p-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg border border-slate-200 transition" title="Aumenta Zoom">
                            <i data-lucide="zoom-in" class="w-3.5 h-3.5"></i>
                        </button>
                        <button onclick="zoom(0.8)" class="p-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg border border-slate-200 transition" title="Riduci Zoom">
                            <i data-lucide="zoom-out" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                </div>

                <!-- Canvas Container -->
                <div class="relative flex-1 min-h-[380px] sm:min-h-[480px] bg-white rounded-xl border border-slate-300 overflow-hidden cursor-crosshair shadow-inner">
                    <canvas id="cartesianCanvas" class="absolute inset-0 w-full h-full"></canvas>

                    <!-- Coordinate Hover Badge -->
                    <div id="coordsBadge" class="absolute bottom-3 left-3 bg-white/95 border border-slate-300 text-slate-800 px-3 py-1.5 rounded-lg text-xs font-mono shadow-md pointer-events-none hidden">
                        x: 0.00, y: 0.00
                    </div>

                    <!-- Instructions Overlay for Canvas Dragging -->
                    <div class="absolute top-3 right-3 bg-slate-100/90 border border-slate-300 text-slate-600 px-2.5 py-1 rounded-md text-[10px] pointer-events-none shadow-sm font-medium">
                        Trascina per spostare | Rotella per zoom
                    </div>
                </div>

                <!-- Legend at bottom of canvas -->
                <div class="flex flex-wrap items-center justify-around gap-2 mt-3 pt-2 border-t border-slate-200 text-[11px] text-slate-600 font-medium">
                    <div class="flex items-center gap-1.5">
                        <span class="w-3 h-0.5 bg-rose-600 border border-rose-600" id="legend-domain-line"></span>
                        <span id="legend-domain-label">Escluso dal dominio</span>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <span class="w-2.5 h-2.5 rounded-full bg-indigo-600"></span>
                        <span>Punti Intersezione</span>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <span class="w-3 h-3 bg-rose-500/20 border border-rose-400 rounded-sm"></span>
                        <span>Regione Esclusa</span>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <span class="w-3 h-0.5 bg-emerald-600"></span>
                        <span>Grafico f(x)</span>
                    </div>
                </div>

            </div>
        </div>

    </main>

    <script>
        // --- STATO DELL'APPLICAZIONE ---
        let currentStep = 0;
        let currentExKey = 'ex1';

        // Configurazione Piano Cartesiano
        let scale = 30; // Pixel per unità algebrica
        let originX = 0; // Posizione X dell'origine nei pixel del canvas
        let originY = 0; // Posizione Y dell'origine nei pixel del canvas
        let isDragging = false;
        let startX, startY;

        const canvas = document.getElementById('cartesianCanvas');
        const ctx = canvas.getContext('2d');
        const coordsBadge = document.getElementById('coordsBadge');

        // Data Store Completo per tutti gli esercizi
        const exercisesData = {
            ex1: {
                title: "y = (x + 5) / (x - 5)",
                curveName: "Curva Iperbole",
                hasDomainExclusion: true,
                domainExclusionX: 5,
                domainExclusionLabel: "x = 5",
                evalFunction: (x) => (x + 5) / (x - 5),
                points: [
                    { x: 0, y: -1, label: 'A(0, -1)', color: '#4338ca' },
                    { x: -5, y: 0, label: 'B(-5, 0)', color: '#4338ca' }
                ],
                shadedRegions: [
                    { minX: -Infinity, maxX: -5, regionType: 'y_less_0' },
                    { minX: -5, maxX: 5, regionType: 'y_greater_0' },
                    { minX: 5, maxX: Infinity, regionType: 'y_less_0' }
                ],
                steps: [
                    {
                        title: "A) Determinazione del Dominio",
                        tag: "PASSO 1 DI 4",
                        content: `
                            <p class="text-slate-700">
                                La funzione assegnata è una <strong>funzione algebrica razionale fratta</strong>:
                                $$\\displaystyle y = \\frac{x + 5}{x - 5}$$
                            </p>
                            <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200 space-y-2">
                                <h4 class="font-semibold text-indigo-700 text-xs uppercase tracking-wider">Regola di Esistenza</h4>
                                <p class="text-xs text-slate-600">Poniamo il denominatore diverso da zero per evitare la divisione per zero:</p>
                                <div class="p-2 bg-white rounded-lg text-center font-mono text-indigo-700 border border-indigo-200 shadow-sm">
                                    $$x - 5 \\neq 0 \\implies x \\neq 5$$
                                </div>
                            </div>
                            <div class="space-y-1">
                                <h4 class="font-semibold text-slate-800">Insieme di Definizione (Dominio):</h4>
                                <p class="text-indigo-700 font-medium">
                                    $$\\mathcal{D} = \\mathbb{R} \\setminus \\{5\\} = (-\\infty, 5) \\cup (5, +\\infty)$$
                                </p>
                            </div>
                            <div class="p-3 bg-amber-50 border border-amber-200 rounded-xl text-amber-800 text-xs">
                                <strong>Significato Grafico:</strong> La retta verticale $x = 5$ rappresenta il valore <strong>escluso dal dominio</strong>. La funzione non esiste in questo punto.
                            </div>
                        `,
                        toggles: { asymptote: true, points: false, regions: false, curve: false }
                    },
                    {
                        title: "B) Intersezioni con gli Assi Cartesiani",
                        tag: "PASSO 2 DI 4",
                        content: `
                            <p class="text-slate-700">Troviamo i punti in cui il grafico interseca gli assi cartesiani:</p>
                            <div class="space-y-3">
                                <div class="bg-slate-50 p-3 rounded-xl border border-slate-200">
                                    <h4 class="font-semibold text-indigo-700 text-xs uppercase tracking-wider mb-1">1. Intersezione asse $y$ ($x = 0$)</h4>
                                    <p class="font-mono text-center text-sm font-semibold text-slate-800">
                                        $$y = \\frac{0 + 5}{0 - 5} = \\frac{5}{-5} = -1$$
                                    </p>
                                    <p class="text-xs text-emerald-700 font-bold mt-1">$\\rightarrow$ Punto $A(0, -1)$</p>
                                </div>
                                <div class="bg-slate-50 p-3 rounded-xl border border-slate-200">
                                    <h4 class="font-semibold text-indigo-700 text-xs uppercase tracking-wider mb-1">2. Intersezione asse $x$ ($y = 0$)</h4>
                                    <p class="font-mono text-center text-sm font-semibold text-slate-800">
                                        $$x + 5 = 0 \\implies x = -5$$
                                    </p>
                                    <p class="text-xs text-emerald-700 font-bold mt-1">$\\rightarrow$ Punto $B(-5, 0)$</p>
                                </div>
                            </div>
                        `,
                        toggles: { asymptote: true, points: true, regions: false, curve: false }
                    },
                    {
                        title: "C) Studio del Segno della Funzione",
                        tag: "PASSO 3 DI 4",
                        content: `
                            <p class="text-slate-700">Studiamo la disequazione $\\frac{x + 5}{x - 5} > 0$ per determinare dove la funzione è positiva ($y > 0$) e dove è negativa ($y < 0$):</p>
                            <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 text-xs space-y-1">
                                <p>• <strong>Numeratore $> 0$:</strong> $x + 5 > 0 \\implies x > -5$</p>
                                <p>• <strong>Denominatore $> 0$:</strong> $x - 5 > 0 \\implies x > 5$</p>
                            </div>
                            <div class="bg-white p-3 rounded-xl border border-slate-300 shadow-sm text-xs overflow-x-auto">
                                <div class="grid grid-cols-4 gap-1 text-center font-mono items-center">
                                    <div class="text-left text-slate-500 font-bold">x</div>
                                    <div class="text-indigo-700 font-bold">&lt; -5</div>
                                    <div class="text-indigo-700 font-bold">-5 &lt; x &lt; 5</div>
                                    <div class="text-indigo-700 font-bold">&gt; 5</div>

                                    <div class="text-left text-slate-600">Num</div>
                                    <div class="text-rose-600 font-bold">- - -</div>
                                    <div class="text-emerald-600 font-bold">+ + +</div>
                                    <div class="text-emerald-600 font-bold">+ + +</div>

                                    <div class="text-left text-slate-600">Den</div>
                                    <div class="text-rose-600 font-bold">- - -</div>
                                    <div class="text-rose-600 font-bold">- - -</div>
                                    <div class="text-emerald-600 font-bold">+ + +</div>

                                    <div class="text-left text-slate-900 font-bold border-t border-slate-300 pt-1">y</div>
                                    <div class="text-emerald-600 font-bold border-t border-slate-300 pt-1">+</div>
                                    <div class="text-rose-600 font-bold border-t border-slate-300 pt-1">-</div>
                                    <div class="text-emerald-600 font-bold border-t border-slate-300 pt-1">+</div>
                                </div>
                            </div>
                            <p class="text-xs text-slate-600">Sul grafico vengono <strong>cancellate (ombreggiate)</strong> le regioni in cui la curva non può passare.</p>
                        `,
                        toggles: { asymptote: true, points: true, regions: true, curve: false }
                    },
                    {
                        title: "D) Sintesi e Grafico Finale",
                        tag: "PASSO 4 DI 4",
                        content: `
                            <p class="text-slate-700">Sintesi completa dei risultati per $y = \\frac{x+5}{x-5}$:</p>
                            <ul class="list-disc list-inside space-y-1.5 text-xs text-slate-700 bg-slate-50 p-3 rounded-xl border border-slate-200">
                                <li><strong>Tipo:</strong> Funzione algebrica razionale fratta (Iperbole traslata).</li>
                                <li><strong>Escluso dal dominio:</strong> Retta $x = 5$.</li>
                                <li><strong>Intersezioni:</strong> $A(0, -1)$ e $B(-5, 0)$.</li>
                                <li><strong>Segno:</strong> Positiva in $(-\\infty, -5) \\cup (5, +\\infty)$, negativa in $(-5, 5)$.</li>
                            </ul>
                            <div class="p-3 bg-indigo-50 border border-indigo-200 rounded-xl text-indigo-800 text-xs">
                                Per mostrare il tracciato della curva nel piano, spunta l'opzione <strong>"Curva Iperbole"</strong> nei controlli in basso.
                            </div>
                        `,
                        toggles: { asymptote: true, points: true, regions: true, curve: false }
                    }
                ]
            },
            ex2: {
                title: "y = 3x - 6",
                curveName: "Retta",
                hasDomainExclusion: false,
                domainExclusionX: null,
                domainExclusionLabel: "",
                evalFunction: (x) => 3 * x - 6,
                points: [
                    { x: 0, y: -6, label: 'A(0, -6)', color: '#4338ca' },
                    { x: 2, y: 0, label: 'B(2, 0)', color: '#4338ca' }
                ],
                shadedRegions: [
                    { minX: -Infinity, maxX: 2, regionType: 'y_greater_0' },
                    { minX: 2, maxX: Infinity, regionType: 'y_less_0' }
                ],
                steps: [
                    {
                        title: "A) Determinazione del Dominio",
                        tag: "PASSO 1 DI 4",
                        content: `
                            <p class="text-slate-700">
                                La funzione assegnata è una <strong>funzione algebrica polinomiale di 1° grado</strong> (lineare):
                                $$\\displaystyle y = 3x - 6$$
                            </p>
                            <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200 space-y-2">
                                <h4 class="font-semibold text-indigo-700 text-xs uppercase tracking-wider">Regola di Esistenza</h4>
                                <p class="text-xs text-slate-600">Non figurano frazioni (denominatori) né radici di indice pari. La funzione è definita per qualsiasi valore reale di $x$.</p>
                            </div>
                            <div class="space-y-1">
                                <h4 class="font-semibold text-slate-800">Insieme di Definizione (Dominio):</h4>
                                <p class="text-indigo-700 font-medium">
                                    $$\\mathcal{D} = \\mathbb{R} = (-\\infty, +\\infty)$$
                                </p>
                            </div>
                            <div class="p-3 bg-emerald-50 border border-emerald-200 rounded-xl text-emerald-800 text-xs">
                                <strong>Significato Grafico:</strong> Non vi sono valori o rette verticali escluse dal dominio. Il grafico copre l'intero asse $x$.
                            </div>
                        `,
                        toggles: { asymptote: false, points: false, regions: false, curve: false }
                    },
                    {
                        title: "B) Intersezioni con gli Assi Cartesiani",
                        tag: "PASSO 2 DI 4",
                        content: `
                            <p class="text-slate-700">Troviamo i punti di contatto con gli assi cartesiani:</p>
                            <div class="space-y-3">
                                <div class="bg-slate-50 p-3 rounded-xl border border-slate-200">
                                    <h4 class="font-semibold text-indigo-700 text-xs uppercase tracking-wider mb-1">1. Intersezione asse $y$ ($x = 0$)</h4>
                                    <p class="font-mono text-center text-sm font-semibold text-slate-800">
                                        $$y = 3(0) - 6 = -6$$
                                    </p>
                                    <p class="text-xs text-emerald-700 font-bold mt-1">$\\rightarrow$ Punto $A(0, -6)$</p>
                                </div>
                                <div class="bg-slate-50 p-3 rounded-xl border border-slate-200">
                                    <h4 class="font-semibold text-indigo-700 text-xs uppercase tracking-wider mb-1">2. Intersezione asse $x$ ($y = 0$)</h4>
                                    <p class="font-mono text-center text-sm font-semibold text-slate-800">
                                        $$3x - 6 = 0 \\implies 3x = 6 \\implies x = 2$$
                                    </p>
                                    <p class="text-xs text-emerald-700 font-bold mt-1">$\\rightarrow$ Punto $B(2, 0)$</p>
                                </div>
                            </div>
                        `,
                        toggles: { asymptote: false, points: true, regions: false, curve: false }
                    },
                    {
                        title: "C) Studio del Segno della Funzione",
                        tag: "PASSO 3 DI 4",

        function changeFunction(exKey) {
            currentExKey = exKey;
            currentStep = 0;
            
            // Aggiorna nome della spunta nel toggle
            const ex = exercisesData[currentExKey];
            document.getElementById('label-toggle-curve').innerText = ex.curveName;

            setStep(0);
        }

        function initCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;

            // Centra l'origine sul piano cartesiano
            originX = canvas.width / 2 - scale * 1.5;
            originY = canvas.height / 2 + scale * 0.5;

            redrawCanvas();
        }

        function setStep(stepIndex) {
            currentStep = stepIndex;
            const ex = exercisesData[currentExKey];
            
            // Fallback di sicurezza se l'indice dello step non esiste
            if (!ex || !ex.steps || !ex.steps[currentStep]) {
                currentStep = 0;
            }

            const currentStepData = ex.steps[currentStep];

            // Aggiorna classi bottoni Tab
            for (let i = 0; i < 4; i++) {
                const tab = document.getElementById(`tab-${i}`);
                if (tab) {
                    if (i === currentStep) {
                        tab.className = "px-3 py-1.5 rounded-lg transition-all flex items-center gap-1.5 whitespace-nowrap bg-indigo-600 text-white shadow-md shadow-indigo-600/20 font-semibold";
                    } else {
                        tab.className = "px-3 py-1.5 rounded-lg transition-all flex items-center gap-1.5 whitespace-nowrap text-slate-600 hover:text-slate-900 hover:bg-slate-200/60";
                    }
                }
            }

            // Imposta stato dei checkbox visibilità in base allo step (Curva disabilitata di default)
            const toggles = currentStepData.toggles;
            document.getElementById('toggle-asymptote').checked = toggles.asymptote;
            document.getElementById('toggle-points').checked = toggles.points;
            document.getElementById('toggle-regions').checked = toggles.regions;
            document.getElementById('toggle-curve').checked = false; // Disabilitata di default

            // Aggiorna contenuto descrittivo
            document.getElementById('step-tag').innerText = currentStepData.tag;
            document.getElementById('step-content').innerHTML = currentStepData.content;

            // Disabilita/Abilita bottoni avanti/indietro
            document.getElementById('btn-prev').disabled = (currentStep === 0);
            document.getElementById('btn-prev-text').disabled = (currentStep === 0);
            document.getElementById('btn-next').disabled = (currentStep === 3);
            document.getElementById('btn-next-text').disabled = (currentStep === 3);

            // Re-render KaTeX
            if (window.renderMathInElement) {
                renderMathInElement(document.getElementById('step-content'), {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false}
                    ],
                    throwOnError: false
                });
            }

            redrawCanvas();
        }

        function nextStep() {
            if (currentStep < 3) setStep(currentStep + 1);
        }

        function prevStep() {
            if (currentStep > 0) setStep(currentStep - 1);
        }

        // Conversione Coordinate Algebriche <-> Pixel
        function toPixelX(x) { return originX + x * scale; }
        function toPixelY(y) { return originY - y * scale; }
        function toMathX(px) { return (px - originX) / scale; }
        function toMathY(py) { return (originY - py) / scale; }

        // --- TRACCIAMENTO SUL CANVAS (TEMA CHIARO AD ALTA VISIBILITÀ) ---

        function redrawCanvas() {
            if (!ctx) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const ex = exercisesData[currentExKey];
            const showAsymptote = document.getElementById('toggle-asymptote').checked;
            const showPoints = document.getElementById('toggle-points').checked;
            const showRegions = document.getElementById('toggle-regions').checked;
            const showCurve = document.getElementById('toggle-curve').checked;

            // 1. Disegna Griglia e Assi
            drawGrid();

            // 2. Escluso dal Dominio (Linea o regione ombreggiata a sinistra per Es. 3)
            if (showAsymptote && ex.hasDomainExclusion && ex.domainExclusionX !== null) {
                if (ex.domainExclusionIsRegionLeft) {
                    // Ombreggia l'intera regione non definita x < 0.5
                    const mathMinX = toMathX(0);
                    const mathMinY = toMathY(canvas.height);
                    const mathMaxY = toMathY(0);
                    const pX1 = toPixelX(mathMinX);
                    const pX2 = toPixelX(ex.domainExclusionX);
                    const pYMax = toPixelY(mathMaxY);
                    const pYMin = toPixelY(mathMinY);
                    fillAndHatchBox(pX1, pYMax, pX2, pYMin);

                    // Linea di confine NETTA E PIENA per x = 0.5 (punto x=1/2 INCLUSO nel dominio)
                    ctx.save();
                    ctx.beginPath();
                    ctx.setLineDash([]); // Linea continua piena per es. 3
                    ctx.strokeStyle = '#dc2626';
                    ctx.lineWidth = 2.5;
                    const pxX = toPixelX(ex.domainExclusionX);
                    ctx.moveTo(pxX, 0);
                    ctx.lineTo(pxX, canvas.height);
                    ctx.stroke();
                    ctx.restore();
                } else {
                    // Linea verticale tratteggiata per valori esclusi dal dominio (funzioni fratte)
                    ctx.save();
                    ctx.beginPath();
                    ctx.setLineDash([6, 6]);
                    ctx.strokeStyle = '#dc2626';
                    ctx.lineWidth = 2.5;
                    const pxX = toPixelX(ex.domainExclusionX);
                    ctx.moveTo(pxX, 0);
                    ctx.lineTo(pxX, canvas.height);
                    ctx.stroke();
                    ctx.restore();
                }
            }

            // 3. Ombreggiatura Regioni Escluse dallo Studio del Segno
            if (showRegions) {
                drawShadedRegions();
            }

            // 4. Curva della Funzione
            if (showCurve) {
                drawFunctionCurve();
            }

            // 5. Punti di Intersezione
            if (showPoints && ex.points) {
                ex.points.forEach(p => {
                    drawPoint(p.x, p.y, p.label, p.color);
                });
            }
        }

        function drawGrid() {
            ctx.save();

            const minX = Math.floor(toMathX(0));
            const maxX = Math.ceil(toMathX(canvas.width));
            const minY = Math.floor(toMathY(canvas.height));
            const maxY = Math.ceil(toMathY(0));

            // Griglia secondaria tenue
            ctx.strokeStyle = '#e2e8f0'; // Slate 200
            ctx.lineWidth = 1;
            ctx.beginPath();
            for (let x = minX; x <= maxX; x++) {
                ctx.moveTo(toPixelX(x), 0);
                ctx.lineTo(toPixelX(x), canvas.height);
            }
            for (let y = minY; y <= maxY; y++) {
                ctx.moveTo(0, toPixelY(y));
                ctx.lineTo(canvas.width, toPixelY(y));
            }
            ctx.stroke();

            // Assi Cartesiani (Neri, Alta Visibilità)
            ctx.strokeStyle = '#0f172a'; // Slate 900
            ctx.lineWidth = 2;
            ctx.beginPath();
            // Asse X
            ctx.moveTo(0, originY);
            ctx.lineTo(canvas.width, originY);
            // Asse Y
            ctx.moveTo(originX, 0);
            ctx.lineTo(originX, canvas.height);
            ctx.stroke();

            // Frecce per gli assi
            ctx.fillStyle = '#0f172a';
            // Freccia Asse X
            ctx.beginPath();
            ctx.moveTo(canvas.width - 2, originY);
            ctx.lineTo(canvas.width - 10, originY - 4);
            ctx.lineTo(canvas.width - 10, originY + 4);
            ctx.fill();
            // Freccia Asse Y
            ctx.beginPath();
            ctx.moveTo(originX, 2);
            ctx.lineTo(originX - 4, 10);
            ctx.lineTo(originX + 4, 10);
            ctx.fill();

            // Numeri ed etichette graduazione
            ctx.fillStyle = '#334155'; // Slate 700
            ctx.font = '500 11px Inter, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';

            const step = scale < 15 ? 5 : scale < 25 ? 2 : 1;

            for (let x = minX; x <= maxX; x += step) {
                if (x !== 0) {
                    const px = toPixelX(x);
                    ctx.beginPath();
                    ctx.strokeStyle = '#0f172a';
                    ctx.moveTo(px, originY - 3);
                    ctx.lineTo(px, originY + 3);
                    ctx.stroke();
                    ctx.fillText(x.toString(), px, originY + 6);
                }
            }

            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';
            for (let y = minY; y <= maxY; y += step) {
                if (y !== 0) {
                    const py = toPixelY(y);
                    ctx.beginPath();
                    ctx.strokeStyle = '#0f172a';
                    ctx.moveTo(originX - 3, py);
                    ctx.lineTo(originX + 3, py);
                    ctx.stroke();
                    ctx.fillText(y.toString(), originX - 6, py);
                }
            }

            // Etichetta Origine O
            ctx.fillText('0', originX - 6, originY + 12);

            ctx.restore();
        }

        function drawShadedRegions() {
            const ex = exercisesData[currentExKey];
            if (!ex.shadedRegions) return;

            const mathMinX = toMathX(0);
            const mathMaxX = toMathX(canvas.width);
            const mathMinY = toMathY(canvas.height);
            const mathMaxY = toMathY(0);

            ex.shadedRegions.forEach(region => {
                const rMinX = Math.max(region.minX, mathMinX);
                const rMaxX = Math.min(region.maxX, mathMaxX);

                if (rMinX < rMaxX) {
                    const pX1 = toPixelX(rMinX);
                    const pX2 = toPixelX(rMaxX);

                    if (region.regionType === 'y_less_0') {
                        // Cancella il semipiano inferiore (y < 0)
                        const pY0 = toPixelY(0);
                        const pYMin = toPixelY(mathMinY);
                        fillAndHatchBox(pX1, pY0, pX2, pYMin);
                    } else if (region.regionType === 'y_greater_0') {
                        // Cancella il semipiano superiore (y > 0)
                        const pY0 = toPixelY(0);
                        const pYMax = toPixelY(mathMaxY);
                        fillAndHatchBox(pX1, pYMax, pX2, pY0);
                    } else if (region.regionType === 'full') {
                        // Cancella l'intera fascia verticale
                        const pYMax = toPixelY(mathMaxY);
                        const pYMin = toPixelY(mathMinY);
                        fillAndHatchBox(pX1, pYMax, pX2, pYMin);
                    }
                }
            });
        }

        function fillAndHatchBox(x1, y1, x2, y2) {
            ctx.save();
            ctx.fillStyle = 'rgba(239, 68, 68, 0.1)';
            const width = x2 - x1;
            const height = y2 - y1;
            ctx.fillRect(x1, y1, width, height);

            ctx.beginPath();
            ctx.rect(x1, y1, width, height);
            ctx.clip();

            ctx.strokeStyle = 'rgba(239, 68, 68, 0.25)';
            ctx.lineWidth = 1;
            const step = 12;
            for (let pos = x1 - Math.abs(height); pos < x2 + Math.abs(height); pos += step) {
                ctx.moveTo(pos, y2);
                ctx.lineTo(pos + Math.abs(height), y1);
            }
            ctx.stroke();
            ctx.restore();
        }

        function drawFunctionCurve() {
            ctx.save();
            ctx.strokeStyle = '#059669'; // Smeraldo ad alta visibilità
            ctx.lineWidth = 3;

            const ex = exercisesData[currentExKey];
            let started = false;

            ctx.beginPath();
            for (let px = 0; px < canvas.width; px += 1.5) {
                const x = toMathX(px);
                const y = ex.evalFunction(x);

                if (isNaN(y) || !isFinite(y) || Math.abs(y) > 100) {
                    started = false;
                    continue;
                }

                const py = toPixelY(y);

                if (!started) {
                    ctx.moveTo(px, py);
                    started = true;
                } else {
                    ctx.lineTo(px, py);
                }
            }
            ctx.stroke();

            ctx.restore();
        }

        function drawPoint(x, y, label, color) {
            const px = toPixelX(x);
            const py = toPixelY(y);

            ctx.save();
            ctx.fillStyle = color;
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2.5;

            ctx.beginPath();
            ctx.arc(px, py, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Etichetta del punto
            ctx.fillStyle = '#1e1b4b';
            ctx.font = 'bold 12px Inter, sans-serif';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'bottom';
            ctx.fillText(label, px + 8, py - 6);

            ctx.restore();
        }

        // --- CONTROLLI INTERATTIVI CANVAS (PAN & ZOOM) ---

        function zoom(factor) {
            scale *= factor;
            scale = Math.max(10, Math.min(150, scale));
            redrawCanvas();
        }

        function resetZoom() {
            scale = 30;
            originX = canvas.width / 2 - scale * 1.5;
            originY = canvas.height / 2 + scale * 0.5;
            redrawCanvas();
        }

        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX - originX;
            startY = e.clientY - originY;
        });

        window.addEventListener('mousemove', (e) => {
            if (isDragging) {
                originX = e.clientX - startX;
                originY = e.clientY - startY;
                redrawCanvas();
            }

            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            if (mouseX >= 0 && mouseX <= canvas.width && mouseY >= 0 && mouseY <= canvas.height) {
                const mathX = toMathX(mouseX);
                const mathY = toMathY(mouseY);

                coordsBadge.classList.remove('hidden');
                coordsBadge.innerHTML = `x: <span class="text-indigo-700 font-bold">${mathX.toFixed(2)}</span>, y: <span class="text-indigo-700 font-bold">${mathY.toFixed(2)}</span>`;
            } else {
                coordsBadge.classList.add('hidden');
            }
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
            
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            const mathX = toMathX(mouseX);
            const mathY = toMathY(mouseY);

            scale *= zoomFactor;
            scale = Math.max(10, Math.min(150, scale));

            originX = mouseX - mathX * scale;
            originY = mouseY + mathY * scale;

            redrawCanvas();
        }, { passive: false });

        // Gestione Resize Finestra
        window.addEventListener('resize', () => {
            initCanvas();
        });

        // Inizializzazione all'avvio
        window.onload = function() {
            if (window.lucide) {
                lucide.createIcons();
            }
            initCanvas();
            setStep(0);
        };
    </script>
</body>
